                const input = document.getElementById('field-' + key);
                const settings = config.content.form.fields[key];
                const value = input.value.trim();
                const valid = isFieldValueValid(key);
                if (!valid) errors.push(key);
                const showError = !valid && (showAll || touchedFields.has(input.id));
                input.setAttribute('aria-invalid', String(showError));
                input.classList.toggle('is-filled', value.length > 0);
                setText('error-' + key, showError ? settings.error : '');
                const warning = document.getElementById('warning-' + key);
                const wasHidden = warning.hidden;
                warning.hidden = !showError;
                if (showError && wasHidden) {
                    animateElement(warning, [
                        { opacity: 0, transform: 'scale(0.75)' },
                        { opacity: 1, transform: 'scale(1)' }
                    ], { duration: config.animations.validationDuration, easing: config.animations.springEasing });
                }
                input.title = showError ? settings.error : '';
            });
            const checkbox = document.getElementById('consent-checkbox');
            const missingConsent = config.content.form.consent.required && !checkbox.checked;
            if (missingConsent) errors.push('consent');
            const consentError = missingConsent && showAll;
            checkbox.setAttribute('aria-invalid', String(consentError));
            setText('error-consent', consentError ? config.content.form.consent.error : '');
            isFormValid = errors.length === 0;
            return errors;
        }

        /**
         * Show recoverable form feedback while retaining entered values.
         * @param {string} message - Configured copy or an empty string.
         */
        function setFormFeedback(message) {
            const feedback = document.getElementById('form-feedback');
            feedback.textContent = message;
            feedback.hidden = !message;
        }

        /**
         * Reveal a field within the form scroller without scrolling the publisher page.
         * @param {HTMLElement} input - Invalid or focused form control.
         */
        function revealFormField(input) {
            const scroller = document.getElementById('form-fields');
            const field = input.closest('.form-field');
            const bounds = scroller.getBoundingClientRect();
            const target = field.getBoundingClientRect();
            if (target.bottom > bounds.bottom) scroller.scrollTop += target.bottom - bounds.bottom;
            if (target.top < bounds.top) scroller.scrollTop -= bounds.top - target.top;
        }

        /** Gate submission on valid fields and consent, and distinguish a pending request. */
        function updateSubmitButton() {
            const button = document.getElementById('submit-button');
            const wasDisabled = button.disabled;
            const checkbox = document.getElementById('consent-checkbox');
            isFormValid = Object.keys(config.content.form.fields).every(isFieldValueValid) &&
                (!config.content.form.consent.required || checkbox.checked);
            button.disabled = isSubmitting || !isFormValid;
            button.setAttribute('aria-disabled', String(button.disabled));
            button.classList.toggle('is-submitting', isSubmitting);
            document.getElementById('consent-row').classList.toggle('is-checked', checkbox.checked);
            button.querySelector('span').textContent = isSubmitting ?
                config.content.form.submitCta.pendingText : config.content.form.submitCta.text;
            document.getElementById('form-back').disabled = isSubmitting;
            document.getElementById('open-privacy').disabled = isSubmitting;
            document.getElementById('lead-form').setAttribute('aria-busy', String(isSubmitting));
            document.querySelectorAll('#lead-form input, #lead-form textarea').forEach(input => {
                input.disabled = isSubmitting;
            });
            if (wasDisabled && !button.disabled) {
                revealElement(button, 0, 2, config.animations.controlDuration);
            }
        }

        /** Collect lead-only values and retain the full name for backend mapping. */
        function collectFormData() {
            const fullName = document.getElementById('field-name').value.trim();
            const parts = fullName.split(/\s+/);
            return {
                firstName: parts[0] || '',
                lastName: parts.slice(1).join(' '),
                fullName: fullName,
                email: document.getElementById('field-email').value.trim(),
                mobile: document.getElementById('field-mobile').value.trim(),
                message: document.getElementById('field-message').value.trim(),
                consent: document.getElementById('consent-checkbox').checked,
                consentTimestamp: consentAcceptedAt,
                consentVersion: config.content.privacy.noticeVersion,
                privacyPolicyUrl: config.content.privacy.policyCta.url,
                termsOfUseUrl: config.content.privacy.termsCta.url
            };
        }

        /**
         * Complete valid forms with an optional webhook, then show confirmation.
         * @param {SubmitEvent} event - Native form submission.
         */
        async function submitForm(event) {
            event.preventDefault();
            if (isSubmitting || !document.getElementById('privacy-overlay').hidden) return;
            const errors = validateForm(true);
            if (!isFormValid) {
                errors.forEach(key => touchedFields.add(key === 'consent' ? 'consent-checkbox' : 'field-' + key));
                setFormFeedback('');
                const firstInvalidField = document.getElementById(errors[0] === 'consent' ? 'consent-checkbox' : 'field-' + errors[0]);
                firstInvalidField.focus({ preventScroll: true });
                if (errors[0] !== 'consent') revealFormField(firstInvalidField);
                track('form_error', { reason: 'validation', fields: errors, propertyId: getSelectedProperty().id });
                return;
            }

            const webhook = config.lead.webhook;
            const hasWebhook = webhook.enabled && !!webhook.url && webhook.url !== 'YOUR_WEBHOOK_URL_HERE';

            const property = getSelectedProperty();
            const formData = collectFormData();
            const payload = {
                ...webhook.payloadTemplate,
                ...formData,
                mobile: formData.mobile || null,
                timestamp: new Date().toISOString(),
                campaign: config.lead.webhook.metadata.campaign,
                adUnit: config.lead.webhook.metadata.adUnit,
                source: config.lead.webhook.metadata.source,
                propertyId: property.id,
                propertyAddress: property.title,
                listingUrl: property.url
            };
            isSubmitting = true;
            updateSubmitButton();
            setFormFeedback('');
            const controller = hasWebhook ? new AbortController() : null;
            const timeout = hasWebhook ? setTimeout(() => controller.abort(), webhook.timeout) : null;

            try {
                if (hasWebhook) {
                    const response = await fetch(webhook.url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });
                    if (!response.ok) throw new Error('submission_failed');
                }
                submittedProperty = property;
                track('form_submitted', {
                    propertyId: property.id,
                    webhookSent: hasWebhook,
                    fields: {
                        name: !!formData.fullName,
                        email: !!formData.email,
                        mobile: !!formData.mobile,
                        message: !!formData.message,
                        consent: !!formData.consent
                    }
                });
                document.getElementById('lead-form').reset();
                consentAcceptedAt = null;
                touchedFields.clear();
                formStarted = false;
                validateForm(false);
                setState('confirmation');
                console.log('[FORM] Submission completed');
            } catch (error) {
                const reason = error.name === 'AbortError' ? 'timeout' : 'request_failed';
                setFormFeedback(config.content.form.messages.submissionError);
                track('form_error', { reason: reason, propertyId: property.id });
                console.warn('[FORM] Submission failed', reason);
            } finally {
                clearTimeout(timeout);
                isSubmitting = false;
                updateSubmitButton();
            }
        }

        /**
         * Track configured events and image pixels without prospect input values.
         * @param {string} eventName - Configured snake_case event identifier.
         * @param {Object} payload - Non-personal interaction context.
         */
        function track(eventName, payload = {}) {
            if (!config.tracking.enabled) return;
            const event = config.tracking.events[eventName];
            if (!event || !event.enabled) return;
            const eventData = {
                event: event.name,
                category: event.category,
                timestamp: new Date().toISOString(),
                ...payload
            };
            console.log('[TRACKING]', eventData);

            if (event.convPixel) fireConversionPixel(event.convPixel);
            if (event.rtPixel) fireRetargetingPixel(event.rtPixel);

            if (typeof window.gtag === 'function') window.gtag('event', event.name, eventData);
        }
    </script>
</body>
</html>
